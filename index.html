<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#F8F8EB">
    <meta name="description" content="AgManage — cultivating the yields of tomorrow.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://agmanage.com/">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="AgManage">
    <meta property="og:title" content="AgManage">
    <meta property="og:description" content="Cultivating the yields of tomorrow.">
    <meta property="og:url" content="https://agmanage.com/">
    <meta property="og:image" content="https://agmanage.com/agmanage-logo.png">
    <meta property="og:image:width" content="904">
    <meta property="og:image:height" content="236">
    <title>AgManage | Cultivating the Yields of Tomorrow</title>
    <style>
      :root {
        color-scheme: light;
        background: #F8F8EB;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        background: #F8F8EB;
        display: grid;
        place-items: center;
      }

      main {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        padding: 24px;
      }

      .logo {
        display: block;
        width: 100%;
        max-width: 904px;
        height: auto;
      }

      @media (max-width: 480px) {
        main {
          padding: 12px;
        }
      }
    </style>
  </head>
  <body>
    <main aria-label="AgManage">
      <img
        class="logo"
        src="agmanage-logo.png"
        alt="AgManage — cultivating the yields of tomorrow."
        width="904"
        height="236"
        fetchpriority="high"
      >
    </main>
  </body>
</html>
